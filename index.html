<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>GAMUCA</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#08070c;
  color:#f4d9c8;
  font-family:"Courier New",monospace;
}

body{
  overflow-x:hidden;
}

button, input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* CONTENEDOR GENERAL */
.game{
  width:100%;
  min-height:100vh;
  background:#08070c;
}

.screen{
  display:none;
  position:relative;
  width:100%;
  min-height:100vh;
  overflow:hidden;
}

.screen.active{
  display:block;
}

/* PORTADA */
#home{
  width:min(100vw, 56.25vh);
  height:min(177.7777778vw, 100vh);
  min-height:0;
  aspect-ratio:9/16;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background: radial-gradient(circle at center, #261238 0%, #08070c 80%);
  border: 2px solid #5a2a82;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.home-title {
  text-align: center;
  margin-bottom: 20px;
  text-shadow: 0 0 10px #bd68ff;
}

.home-title h1 {
  font-size: 38px;
  color: #e8aaff;
  margin: 0;
  letter-spacing: 4px;
}

.home-title p {
  font-size: 12px;
  color: #a995a9;
  margin-top: 5px;
}

.home-menu {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 70%;
  z-index: 10;
}

.home-btn {
  background: #17101d;
  border: 2px solid #9b4cff;
  color: #f1c9ff;
  padding: 12px;
  font-weight: bold;
  text-transform: uppercase;
  transition: all 0.2s;
  box-shadow: 0 4px 0 #3b195e;
}

.home-btn:hover, .home-btn:active {
  background: #9b4cff;
  color: #fff;
  transform: translateY(2px);
  box-shadow: 0 2px 0 #3b195e;
}

.home-bottom-nav {
  position: absolute;
  bottom: 15px;
  display: flex;
  justify-content: space-around;
  width: 90%;
  z-index: 10;
}

.home-sub-btn {
  background: #100c13;
  border: 1px solid #6e4a78;
  color: #d48cff;
  padding: 8px 10px;
  font-size: 11px;
}

/* CREADOR */
#creator{
  background:#09070d;
}

.creator-stage{
  position:relative;
  width:100%;
  min-height:100vh;
  aspect-ratio:9/16;
  max-width:1000px;
  margin:auto;
  background: linear-gradient(180deg, #140c1d 0%, #08070c 100%);
  border: 1px solid #3b2a40;
  overflow:hidden;
}

.creator-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  background: rgba(20, 12, 29, 0.8);
  border-bottom: 1px solid #49374d;
  z-index: 30;
  position: relative;
}

.btn-back {
  background: #241427;
  border: 1px solid #d48cff;
  color: #f1c9ff;
  padding: 6px 12px;
}

.tabs-bar {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  padding: 10px 15px;
  background: #100c13;
  border-bottom: 1px solid #281930;
  z-index: 30;
  position: relative;
}

.tab-btn {
  background: #17101d;
  border: 1px solid #49374d;
  color: #c9a8db;
  padding: 6px 10px;
  font-size: 12px;
  white-space: nowrap;
}

.tab-btn:hover, .tab-btn.active {
  background: #9b4cff;
  color: #fff;
  border-color: #e8aaff;
}

/* PERSONAJE PREVIEW */
.avatar-preview {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 20px 0;
  z-index: 25;
  position: relative;
}

.avatar-box {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: 3px solid #9b4cff;
  background: #1c1326;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 50px;
  box-shadow: 0 0 20px rgba(155, 76, 255, 0.4);
}

.avatar-info {
  margin-top: 10px;
  text-align: center;
}

.avatar-info h3 {
  margin: 0;
  color: #e8aaff;
  font-size: 16px;
}

.avatar-info p {
  margin: 3px 0 0;
  font-size: 12px;
  color: #a995a9;
}

/* PANEL DE CONFIGURACIÓN */
.creator-controls {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 0 20px;
  z-index: 30;
  position: relative;
}

.control-btn {
  background: #120d15;
  border: 1px solid #49374d;
  color: #f0d8e9;
  padding: 12px;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.control-btn:hover {
  border-color: #c26bff;
  background: #24152d;
}

.control-btn.primary {
  background: #9b4cff;
  color: #fff;
  font-weight: bold;
  text-align: center;
  justify-content: center;
  margin-top: 10px;
  box-shadow: 0 0 15px rgba(155, 76, 255, 0.5);
}

/* EFECTOS AMBIENTALES */
.ambient{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:20;
  overflow:hidden;
}

.light{
  position:absolute;
  width:8%;
  aspect-ratio:1;
  border-radius:50%;
  background:rgba(255,190,100,.20);
  filter:blur(10px);
  animation:flicker 1.7s infinite alternate;
}

.light.l1{left:6%;top:28%;animation-duration:1.3s}
.light.l2{left:91%;top:45%;animation-duration:2.1s}
.light.l3{left:3%;top:74%;animation-duration:1.8s}
.light.l4{left:94%;top:78%;animation-duration:1.5s}
.light.l5{left:45%;top:91%;animation-duration:2.3s}

@keyframes flicker{
  0%{ opacity:.25; transform:scale(.85); }
  35%{ opacity:.75; transform:scale(1.08); }
  60%{ opacity:.4; transform:scale(.92); }
  100%{ opacity:.85; transform:scale(1.12); }
}

.spark{
  position:absolute;
  width:3px;
  height:3px;
  background:#f7c99e;
  box-shadow:0 0 5px #d98cff;
  opacity:0;
  animation:floatSpark 5s infinite;
}

.s1{left:15%;top:65%;animation-delay:.2s}
.s2{left:31%;top:35%;animation-delay:1.4s}
.s3{left:72%;top:51%;animation-delay:2.2s}
.s4{left:87%;top:66%;animation-delay:3s}
.s5{left:55%;top:78%;animation-delay:4s}

@keyframes floatSpark{
  0%{ opacity:0; transform:translateY(15px); }
  30%{ opacity:.8; }
  100%{ opacity:0; transform:translateY(-70px); }
}

/* MODALES */
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(4,3,8,.88);
  padding:5vh 4vw;
  overflow:auto;
}

.modal.open{
  display:flex;
  justify-content:center;
  align-items:center;
}

.modal-box{
  width:min(94vw,700px);
  max-height:90vh;
  overflow:auto;
  background: linear-gradient(180deg,#17101d,#0c0910);
  border:3px solid #9b4cff;
  box-shadow: 0 0 0 3px #26142e, 0 0 30px rgba(175,77,255,.35);
  padding:20px;
}

.modal-title{
  font-size:clamp(18px,4vw,24px);
  color:#e8aaff;
  text-align:center;
  margin-bottom:18px;
  text-shadow:2px 2px #26152f;
}

.close{
  float:right;
  background:#241427;
  border:1px solid #d48cff;
  color:#f1c9ff;
  padding:7px 12px;
}

.option-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-bottom: 15px;
}

.option{
  min-height:50px;
  padding:8px 5px;
  background:#120d15;
  border:1px solid #49374d;
  color:#f0d8e9;
  font-size: 12px;
}

.option:hover, .option.selected{
  border-color:#c26bff;
  box-shadow:0 0 12px rgba(194,107,255,.35);
  background:#24152d;
  color:#fff;
}

.section-title{
  color:#e6a9c9;
  margin:15px 0 8px;
  font-size:14px;
  border-bottom: 1px solid #3b2a40;
  padding-bottom: 4px;
}

.career-search{
  width:100%;
  padding:12px;
  background:#0a080d;
  color:white;
  border:1px solid #6e4a78;
  outline:none;
  margin-bottom:12px;
}

.career-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:45vh;
  overflow:auto;
}

.career-card{
  text-align:left;
  padding:11px;
  background:#100c13;
  border:1px solid #3b2a40;
  color:#eee;
}

.career-card strong{
  display:block;
  color:#f3c9dc;
}

.career-card small{
  color:#a995a9;
}

.career-card:hover, .career-card.selected{
  border-color:#bd68ff;
  background:#21132b;
}

/* RESPONSIVE */
@media(max-width:600px){
  .creator-stage{
    width:100vw;
    min-height:100vh;
  }
  .modal{ padding:2vh 2vw; }
  .modal-box{ padding:14px; }
  .option-grid{ grid-template-columns:repeat(2,1fr); }
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(30px);
  background:#180e20;
  border:1px solid #bd68ff;
  color:#fff;
  padding:12px 18px;
  z-index:300;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>

};

function updateUI() {
  document.getElementById("lblCareer").textContent = character.career || "Sin elegir";
  document.getElementById("lblCourse").textContent = character.course || "Sin elegir";
  document.getElementById("lblPersonality").textContent = character.personality || "Sin elegir";

  document.getElementById("previewCareer").textContent = character.career || "Selecciona tu Carrera";
  let sub = [];
  if(character.campus) sub.push("Campus: " + character.campus);
  if(character.course) sub.push(character.course);
  if(character.personality) sub.push(character.personality);
  document.getElementById("previewSub").textContent = sub.length ? sub.join(" • ") : "Curso / Personalidad no asignados";
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

function openCreator(){ showScreen("creator"); updateUI(); }
function goHome(){ showScreen("home"); }

function continueGame(){
  const saved = localStorage.getItem("gamucaCharacter");
  if(saved){
    character = JSON.parse(saved);
    updateUI();
    showMessage("Partida cargada: " + (character.career || "Personaje"));
    openCreator();
  }else{
    showMessage("No hay ninguna partida guardada.");
  }
}

function closeModal(id){
  document.getElementById(id).classList.remove("open");
}

function openCustomization(category){
  const modal = document.getElementById("customModal");
  const title = document.getElementById("customTitle");
  const content = document.getElementById("customContent");

  title.textContent = category;
  content.innerHTML = "";

  const groups = customization[category];

  Object.entries(groups).forEach(([group, items])=>{
    const heading = document.createElement("div");
    heading.className = "section-title";
    heading.textContent = group;
    content.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "option-grid";

    items.forEach(item => {
      const button = document.createElement("button");
      button.className = "option";
      button.textContent = item;

      button.onclick = () => {
        grid.querySelectorAll(".option").forEach(b => b.classList.remove("selected"));
        button.classList.add("selected");

        if(category==="APARIENCIA"){
          if(group==="TIPO DE CARA") character.appearance=item;
          if(group==="COLOR DE PIEL") character.skin=item;
          if(group==="OJOS") character.eyes=item;
          if(group==="CEJAS") character.brows=item;
          if(group==="EXPRESIÓN") character.expression=item;
        }
        if(category==="PEINADO") character.hair=item;
        if(category==="ROPA") character.clothes=item;
        if(category==="PENDIENTES") character.earrings=item;
        if(category==="EXTRAS") character.extras=item;

        showMessage("Seleccionado: " + item);
      };

      grid.appendChild(button);
    });

    content.appendChild(grid);
  });

  modal.classList.add("open");
}

function openCareer(){
  document.getElementById("careerModal").classList.add("open");
  renderCareers(careers);
}

function renderCareers(list){
  const container = document.getElementById("careerList");
  container.innerHTML = "";

  list.forEach(([name, campus]) => {
    const button = document.createElement("button");
    button.className = "career-card";
    if(character.career === name) button.classList.add("selected");

    button.innerHTML = "<strong>" + name + "</strong><small>Campus: " + campus + "</small>";

    button.onclick = () => {
      character.career = name;
      character.campus = campus;
      updateUI();
      closeModal("careerModal");
      showMessage("Carrera: " + name);
    };

    container.appendChild(button);
  });
}

function filterCareers(){
  const search = document.getElementById("careerSearch").value.toLowerCase().trim();
  const filtered = careers.filter(([name, campus]) =>
    (name + " " + campus).toLowerCase().includes(search)
  );
  renderCareers(filtered);
}

function openCourse(){ document.getElementById("courseModal").classList.add("open"); }

function selectCourse(course){
  character.course = course;
  updateUI();
  closeModal("courseModal");
  showMessage("Curso: " + course);
}

function openPersonality(){ document.getElementById("personalityModal").classList.add("open"); }

function selectPersonality(personality){
  character.personality = personality;
  updateUI();
  closeModal("personalityModal");
  showMessage("Personalidad: " + personality);
}

function randomItem(array){
  return array[Math.floor(Math.random() * array.length)];
}

function randomCharacter(){
  const car = randomItem(careers);
  character.career = car[0];
  character.campus = car[1];
  character.course = randomItem(["1º", "2º", "3º", "4º"]);
  character.personality = randomItem(["ESTUDIOSO/A", "SOCIAL", "REBELDE", "AMBICIOSO/A", "CAÓTICO/A", "CREATIVO/A"]);
  character.hair = randomItem(customization.PEINADO["CORTES"]);
  character.clothes = randomItem(customization.ROPA["PRENDAS"]);

  updateUI();
  showMessage("🎲 Personaje aleatorio generado");
}

function createCharacter(){
  if(!character.career){ showMessage("Elige una carrera."); openCareer(); return; }
  if(!character.course){ showMessage("Elige tu curso."); openCourse(); return; }
  if(!character.personality){ showMessage("Elige una personalidad."); openPersonality(); return; }

  localStorage.setItem("gamucaCharacter", JSON.stringify(character));
  showMessage("✓ ¡Personaje creado y guardado con éxito!");
}

let toastTimer;
function showMessage(message){
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove("show"); }, 2200);
}

document.querySelectorAll(".modal").forEach(modal => {
  modal.addEventListener("click", event => {
    if(event.target === modal) modal.classList.remove("open");
  });
});

document.addEventListener("keydown", event => {
  if(event.key === "Escape"){
    document.querySelectorAll(".modal").forEach(m => m.classList.remove("open"));
  }
});
</script>

</body>
</html>

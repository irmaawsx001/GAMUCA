<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GAMUCA</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html, body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100vh;
  background:#08070c;
  color:#f4d9c8;
  font-family:"Courier New", monospace;
  overflow-x:hidden;
}

button, input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================================================
   CONTENEDOR GENERAL (RELACIÓN DE ASPECTO 9:16)
========================================================= */

.game{
  width:100%;
  min-height:100vh;
  background:#08070c;
  display:flex;
  justify-content:center;
  align-items:center;
}

.screen{
  display:none;
  position:relative;
  width:min(100vw, 56.25vh);
  height:min(177.7777778vw, 100vh);
  aspect-ratio:9/16;
  overflow:hidden;
  margin: auto;
}

.screen.active{
  display:block;
}

/* =========================================================
   PORTADA
========================================================= */

#home{
  background: #08080c url("file_00000000b9d881f4b24a2fea9f042d49.png") center center / cover no-repeat;
}

.home-hit{
  position:absolute;
  background:transparent;
  border:0;
  z-index:10;
}

/* Alineación exacta con los botones dibujados en la portada */
.home-play      { left:26.5%; width:47%; top:62.8%; height:5.8%; }
.home-create    { left:27.5%; width:45%; top:69.5%; height:5.2%; }
.home-continue  { left:27.5%; width:45%; top:75.2%; height:5.2%; }
.home-options   { left:32.0%; width:36%; top:81.0%; height:5.0%; }

/* Botones inferiores */
.home-about     { left:16%; width:16%; bottom:2.5%; height:5%; }
.home-ranking   { left:34%; width:16%; bottom:2.5%; height:5%; }
.home-achievements { left:52%; width:16%; bottom:2.5%; height:5%; }
.home-shop      { left:70%; width:16%; bottom:2.5%; height:5%; }

/* =========================================================
   CREADOR DE PERSONAJE
========================================================= */

#creator{
  background: #09070d url("file_000000008f9081f48664970b19944855.png") center top / cover no-repeat;
}

/* Botón "X" arriba a la derecha */
.close-stage-hit {
  position: absolute;
  top: 1.5%;
  right: 3%;
  width: 10%;
  height: 5.5%;
  background: transparent;
  border: 0;
  z-index: 40;
}

/* Personaje montado sobre el espejo */
.character-base-img {
  position: absolute;
  top: 11.2%;
  left: 17.5%;
  width: 20%;
  height: auto;
  z-index: 12;
  pointer-events: none;
  user-select: none;
  filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
}

/* Pestañas de Personalización (Alineadas con la rejilla beige/negra) */
.creator-tab {
  position: absolute;
  top: 51.0%;
  height: 4.2%;
  background: transparent;
  border: 0;
  z-index: 30;
}

.tab-apariencia { left: 6%;   width: 18.5%; }
.tab-peinado    { left: 24.5%; width: 17%; }
.tab-ropa       { left: 41.5%; width: 18.5%; }
.tab-pendientes { left: 60%;   width: 18%; }
.tab-extras     { left: 78%;   width: 16%; }

/* Hitboxes transparentes sobre los elementos dinámicos dentro del recuadro del arte */
.options-overlay-panel {
  position: absolute;
  top: 56.5%;
  left: 6%;
  width: 88%;
  height: 29.5%;
  z-index: 35;
  overflow-y: auto;
  padding: 6px 4px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.options-overlay-panel::-webkit-scrollbar {
  width: 4px;
}
.options-overlay-panel::-webkit-scrollbar-thumb {
  background: #49374d;
}

.pixel-section-title {
  color: #d9a86c;
  font-size: 9px;
  text-transform: uppercase;
  margin-top: 2px;
  letter-spacing: 1px;
}

.pixel-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
}

.pixel-opt-btn {
  background: rgba(18, 13, 21, 0.75);
  border: 1px solid #3b2a40;
  border-radius: 3px;
  color: #f0d8e9;
  padding: 5px 2px;
  font-size: 9px;
  text-align: center;
  transition: all 0.15s ease;
}

.pixel-opt-btn:hover, .pixel-opt-btn.selected {
  border-color: #f3c9dc;
  background: rgba(189, 104, 255, 0.3);
  box-shadow: 0 0 6px rgba(189, 104, 255, 0.5);
}

/* Botón "CREAR PERSONAJE" centrado en el banner inferior */
.create-btn-hit {
  position: absolute;
  top: 87.5%;
  left: 18.5%;
  width: 63%;
  height: 5.2%;
  background: transparent;
  border: 0;
  z-index: 40;
}

/* =========================================================
   EFECTOS Y MODALES
========================================================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(4,3,8,.88);
  padding:5vh 4vw;
  overflow:auto;
}

.modal.open{
  display:flex;
  justify-content:center;
  align-items:center;
}

.modal-box{
  width:min(94vw,500px);
  max-height:85vh;
  overflow:auto;
  background: linear-gradient(180deg,#17101d,#0c0910);
  border:2px solid #9b4cff;
  box-shadow:0 0 20px rgba(175,77,255,.35);
  padding:16px;
}

.modal-title{
  font-size:16px;
  color:#e8aaff;
  text-align:center;
  margin-bottom:12px;
}

.close-modal-btn{
  float:right;
  background:#241427;
  border:1px solid #d48cff;
  color:#f1c9ff;
  padding:4px 8px;
}

.career-search{
  width:100%;
  padding:10px;
  background:#0a080d;
  color:white;
  border:1px solid #6e4a78;
  outline:none;
  margin-bottom:10px;
}

.career-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:40vh;
  overflow:auto;
}

.career-card{
  text-align:left;
  padding:8px;
  background:#100c13;
  border:1px solid #3b2a40;
  color:#eee;
  font-size:12px;
}

.career-card strong{ display:block; color:#f3c9dc; }
.career-card small{ color:#a995a9; }
.career-card:hover, .career-card.selected{ border-color:#bd68ff; background:#21132b; }

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(30px);
  background:#180e20;
  border:1px solid #bd68ff;
  color:#fff;
  padding:10px 16px;
  font-size:12px;
  z-index:300;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="game">

<!-- PORTADA -->
<section id="home" class="screen active">
  <button class="home-hit home-play" onclick="openCreator()" aria-label="Jugar"></button>
  <button class="home-hit home-create" onclick="openCreator()" aria-label="Crear personaje"></button>
  <button class="home-hit home-continue" onclick="continueGame()" aria-label="Continuar partida"></button>
  <button class="home-hit home-options" onclick="showMessage('Opciones próximamente')" aria-label="Opciones"></button>

  <button class="home-hit home-about" onclick="showMessage('GAMUCA · Tu carrera. Tu personaje. Tu partida.')" aria-label="Sobre"></button>
  <button class="home-hit home-ranking" onclick="showMessage('Ranking próximamente')" aria-label="Ranking"></button>
  <button class="home-hit home-achievements" onclick="showMessage('Logros próximamente')" aria-label="Logros"></button>
  <button class="home-hit home-shop" onclick="showMessage('Tienda próximamente')" aria-label="Tienda"></button>
</section>

<!-- CREADOR DE PERSONAJE -->
<section id="creator" class="screen">

  <!-- Botón Salir (X) -->
  <button class="close-stage-hit" onclick="goHome()" aria-label="Cerrar"></button>

  <!-- Imagen recortada del personaje montada sobre el Espejo -->
  <img src="file_00000000dbac82109b35918672afabd5.png" alt="Personaje Base" class="character-base-img">

  <!-- Pestañas transparentes sobre el diseño -->
  <button class="creator-tab tab-apariencia" onclick="switchCategory('APARIENCIA')"></button>
  <button class="creator-tab tab-peinado"    onclick="switchCategory('PEINADO')"></button>
  <button class="creator-tab tab-ropa"       onclick="switchCategory('ROPA')"></button>
  <button class="creator-tab tab-pendientes" onclick="switchCategory('PENDIENTES')"></button>
  <button class="creator-tab tab-extras"     onclick="switchCategory('EXTRAS')"></button>

  <!-- Opciones internas dinámicas -->
  <div class="options-overlay-panel" id="optionsPanel"></div>

  <!-- Botón "CREAR PERSONAJE" -->
  <button class="create-btn-hit" onclick="createCharacter()" aria-label="Crear Personaje"></button>

</section>

</div>

<!-- MODAL DE CARRERA -->
<div id="careerModal" class="modal">
  <div class="modal-box">
    <button class="close-modal-btn" onclick="closeModal('careerModal')">✕</button>
    <div class="modal-title">🎓 ELIGE TU CARRERA</div>
    <input id="careerSearch" class="career-search" placeholder="Buscar carrera..." oninput="filterCareers()">
    <div id="careerList" class="career-list"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let character = {
  career:"",
  campus:"",
  appearance:"Cara 1",
  skin:"Tono 1",
  eyes:"Ojos marrones",
  expression:"Neutra",
  hair:"Largo ondulado",
  clothes:"Casual",
  earrings:"Ninguno",
  extras:"Ninguno"
};

const careers = [
  ["Administración y Dirección de Empresas","Jerez / Algeciras"],
  ["Ingeniería Informática","Cádiz"],
  ["Derecho","Jerez / Algeciras"],
  ["Medicina","Cádiz"],
  ["Criminología y Seguridad","Jerez"],
  ["Biotecnología","Puerto Real"],
  ["Marketing e Investigación de Mercados","Jerez"],
  ["Psicología","Cádiz"]
];

const customization = {
  APARIENCIA:{
    "TIPO DE CARA":["Cara 1","Cara 2","Cara 3","Cara 4","Cara 5"],
    "TONO DE PIEL":["Claro","Neutro","Bronze","Oscuro","Muy Oscuro"],
    "EXPRESIÓN":["Neutra","Sonriente","Seria","Tímida","Enfadada"],
    "COLOR DE OJOS":["Marrón","Avellana","Verde","Azul","Gris","Rojo"]
  },
  PEINADO:{
    "CORTES":["Largo","Corto","Bob","Pixie","Coleta","Rizos","Flequillo","Undercut"]
  },
  ROPA:{
    "ESTILOS":["Casual","Universitario","Gótico","Formal","Deportivo","Rock","Metal"]
  },
  PENDIENTES:{
    "OPCIONES":["Ninguno","Aros","Cruz","Estrella","Piercing"]
  },
  EXTRAS:{
    "UNIVERSIDAD":["Mochila UCA","Portátil","Apuntes","Gafas","Café"]
  }
};

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

function openCreator(){
  showScreen("creator");
  switchCategory("APARIENCIA");
}

function goHome(){
  showScreen("home");
}

function switchCategory(category){
  const panel = document.getElementById("optionsPanel");
  panel.innerHTML = "";

  const groups = customization[category];
  if(!groups) return;

  Object.entries(groups).forEach(([groupName, items]) => {
    const title = document.createElement("div");
    title.className = "pixel-section-title";
    title.textContent = "◆ " + groupName;
    panel.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "pixel-grid";

    items.forEach(item => {
      const btn = document.createElement("button");
      btn.className = "pixel-opt-btn";
      btn.textContent = item;

      btn.onclick = () => {
        grid.querySelectorAll(".pixel-opt-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        showMessage("Seleccionado: " + item);
      };

      grid.appendChild(btn);
    });

    panel.appendChild(grid);
  });
}

function openCareer(){
  document.getElementById("careerModal").classList.add("open");
  renderCareers(careers);
}

function renderCareers(list){
  const container = document.getElementById("careerList");
  container.innerHTML = "";

  list.forEach(([name, campus]) => {
    const button = document.createElement("button");
    button.className = "career-card";
    button.innerHTML = "<strong>" + name + "</strong><small>Campus: " + campus + "</small>";

    button.onclick = () => {
      character.career = name;
      character.campus = campus;
      closeModal("careerModal");
      showMessage("Carrera: " + name);
    };

    container.appendChild(button);
  });
}

function filterCareers(){
  const search = document.getElementById("careerSearch").value.toLowerCase().trim();
  const filtered = careers.filter(([name, campus]) =>
    (name + " " + campus).toLowerCase().includes(search)
  );
  renderCareers(filtered);
}

function closeModal(id){
  document.getElementById(id).classList.remove("open");
}

function continueGame(){
  const saved = localStorage.getItem("gamucaCharacter");
  if(saved){
    character = JSON.parse(saved);
    showMessage("Cargando partida guardada...");
    openCreator();
  }else{
    showMessage("No hay ninguna partida guardada.");
  }
}

function createCharacter(){
  if(!character.career){
    openCareer();
    return;
  }
  localStorage.setItem("gamucaCharacter", JSON.stringify(character));
  showMessage("✓ ¡Personaje guardado correctamente!");
}

let toastTimer;
function showMessage(message){
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove("show"); }, 2200);
}
</script>

</body>
</html>

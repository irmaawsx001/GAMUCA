<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GAMUCA</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#08070c;
  color:#f4d9c8;
  font-family:"Courier New",monospace;
}

body{
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================================================
   CONTENEDOR GENERAL
========================================================= */

.game{
  width:100%;
  min-height:100vh;
  background:#08070c;
}

.screen{
  display:none;
  position:relative;
  width:100%;
  min-height:100vh;
  overflow:hidden;
}

.screen.active{
  display:block;
}

/* =========================================================
   PORTADA
========================================================= */

#home{
  width:min(100vw, 56.25vh);
  height:min(177.7777778vw, 100vh);
  min-height:0;
  aspect-ratio:9/16;
  margin:0 auto;

  position:relative;
  overflow:hidden;

  background:
    #08080c
    url("archivo_00000000b9d881f4b24a2fea9f042d49.png")
    center center / cover no-repeat;
}

/* zonas invisibles sobre los botones de la portada */

.home-hit{
  position:absolute;
  background:transparent;
  border:0;
  z-index:10;
}

.home-play{
  left:22%;
  right:22%;
  top:56.5%;
  height:6.5%;
}

.home-create{
  left:22%;
  right:22%;
  top:63.2%;
  height:6.5%;
}

.home-continue{
  left:22%;
  right:22%;
  top:70%;
  height:6.5%;
}

.home-options{
  left:22%;
  right:22%;
  top:76.8%;
  height:6.5%;
}

.home-about{
  left:2%;
  width:22%;
  bottom:1%;
  height:8%;
}

.home-ranking{
  left:26%;
  width:22%;
  bottom:1%;
  height:8%;
}

.home-achievements{
  left:50%;
  width:22%;
  bottom:1%;
  height:8%;
}

.home-shop{
  right:2%;
  width:22%;
  bottom:1%;
  height:8%;
}

/* =========================================================
   CREADOR
========================================================= */

#creator{
  background:#09070d;
}

.player-avatar{
  position:absolute;
  z-index:25;
  width:15.5%;
  height:auto;
  left:50%;
  top:29%;
  transform:translateX(-50%);
  image-rendering:pixelated;
  pointer-events:none;
}

.creator-stage{
  position:relative;
  width:100%;
  min-height:100vh;
  aspect-ratio:9/16;
  max-width:1000px;
  margin:auto;

  background:
    url(archivo_000000008f9081f48664970b19944855.png)
    center top / cover no-repeat;

  overflow:hidden;
}

/* =========================================================
   EFECTOS AMBIENTALES
========================================================= */

.ambient{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:20;
  overflow:hidden;
}

.light{
  position:absolute;
  width:8%;
  aspect-ratio:1;
  border-radius:50%;
  background:rgba(255,190,100,.20);
  filter:blur(10px);
  animation:flicker 1.7s infinite alternate;
}

.light.l1{left:6%;top:28%;animation-duration:1.3s}
.light.l2{left:91%;top:45%;animation-duration:2.1s}
.light.l3{left:3%;top:74%;animation-duration:1.8s}
.light.l4{left:94%;top:78%;animation-duration:1.5s}
.light.l5{left:45%;top:91%;animation-duration:2.3s}

@keyframes flicker{
  0%{
    opacity:.25;
    transform:scale(.85);
  }
  35%{
    opacity:.75;
    transform:scale(1.08);
  }
  60%{
    opacity:.4;
    transform:scale(.92);
  }
  100%{
    opacity:.85;
    transform:scale(1.12);
  }
}

.spark{
  position:absolute;
  width:3px;
  height:3px;
  background:#f7c99e;
  box-shadow:0 0 5px #d98cff;
  opacity:0;
  animation:floatSpark 5s infinite;
}

.s1{left:15%;top:65%;animation-delay:.2s}
.s2{left:31%;top:35%;animation-delay:1.4s}
.s3{left:72%;top:51%;animation-delay:2.2s}
.s4{left:87%;top:66%;animation-delay:3s}
.s5{left:55%;top:78%;animation-delay:4s}

@keyframes floatSpark{
  0%{
    opacity:0;
    transform:translateY(15px);
  }
  30%{
    opacity:.8;
  }
  100%{
    opacity:0;
    transform:translateY(-70px);
  }
}

/* =========================================================
   BOTONES TRANSPARENTES SOBRE EL MOCKUP
========================================================= */

.creator-button{
  position:absolute;
  z-index:30;
  background:transparent;
  border:0;
  color:transparent;
}

/* volver */

.back-hit{
  right:3.5%;
  left:auto;
  top:2%;
  width:12%;
  height:6%;
}

/* pestañas */

.tab-appearance{
  left:6%;
  top:63.2%;
  width:17%;
  height:5.2%;
}

.tab-hair{
  left:24%;
  top:63.2%;
  width:17%;
  height:5.2%;
}

.tab-clothes{
  left:42%;
  top:63.2%;
  width:17%;
  height:5.2%;
}

.tab-earrings{
  left:60%;
  top:63.2%;
  width:17%;
  height:5.2%;
}

.tab-extras{
  left:78%;
  top:63.2%;
  width:17%;
  height:5.2%;
}

/* aleatorio */

.random-hit{
  left:8%;
  top:58%;
  width:31%;
  height:6%;
}

/* carrera */

.career-hit{
  left:4%;
  top:64%;
  width:48%;
  height:18%;
}

/* curso */

.course-hit{
  left:54%;
  top:64%;
  width:42%;
  height:7%;
}

/* personalidad */

.personality-hit{
  left:55%;
  top:72%;
  width:42%;
  height:15%;
}

/* crear */

.create-character-hit{
  left:53%;
  top:87%;
  width:44%;
  height:7%;
}

/* =========================================================
   MODAL DE PERSONALIZACIÓN
========================================================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(4,3,8,.88);
  padding:5vh 4vw;
  overflow:auto;
}

.modal.open{
  display:flex;
  justify-content:center;
  align-items:center;
}

.modal-box{
  width:min(94vw,700px);
  max-height:90vh;
  overflow:auto;
  background:
    linear-gradient(180deg,#17101d,#0c0910);
  border:3px solid #9b4cff;
  box-shadow:
    0 0 0 3px #26142e,
    0 0 30px rgba(175,77,255,.35);
  padding:20px;
}

.modal-title{
  font-size:clamp(18px,4vw,30px);
  color:#e8aaff;
  text-align:center;
  margin-bottom:18px;
  text-shadow:2px 2px #26152f;
}

.close{
  float:right;
  background:#241427;
  border:1px solid #d48cff;
  color:#f1c9ff;
  padding:7px 12px;
}

.option-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.option{
  min-height:55px;
  padding:9px 5px;
  background:#120d15;
  border:1px solid #49374d;
  color:#f0d8e9;
}

.option:hover,
.option.selected{
  border-color:#c26bff;
  box-shadow:0 0 12px rgba(194,107,255,.35);
  background:#24152d;
  color:#fff;
}

.option.big{
  grid-column:span 2;
}

.section-title{
  color:#e6a9c9;
  margin:20px 0 9px;
  font-size:15px;
}

/* =========================================================
   CARRERAS
========================================================= */

.career-search{
  width:100%;
  padding:12px;
  background:#0a080d;
  color:white;
  border:1px solid #6e4a78;
  outline:none;
  margin-bottom:12px;
}

.career-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:50vh;
  overflow:auto;
}

.career-card{
  text-align:left;
  padding:11px;
  background:#100c13;
  border:1px solid #3b2a40;
  color:#eee;
}

.career-card strong{
  display:block;
  color:#f3c9dc;
}

.career-card small{
  color:#a995a9;
}

.career-card:hover,
.career-card.selected{
  border-color:#bd68ff;
  background:#21132b;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

  .creator-stage{
    width:100vw;
    height:177.777vw;
    min-height:0;
    max-height:none;
  }

  .modal{
    padding:2vh 2vw;
  }

  .modal-box{
    padding:14px;
  }

  .option-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

/* pantallas grandes */

@media(min-width:900px){
  .creator-stage{
    height:100vh;
    width:auto;
  }
}

/* =========================================================
   MENSAJE
========================================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(30px);
  background:#180e20;
  border:1px solid #bd68ff;
  color:#fff;
  padding:12px 18px;
  z-index:300;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>

/* =========================================================
   PANTALLAS
========================================================= */

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(s=>s.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);
}

function openCreator(){
  showScreen("creator");
}

function goHome(){
  showScreen("home");
}

function continueGame(){

  const saved =
    localStorage.getItem("gamucaCharacter");

  if(saved){

    character = JSON.parse(saved);

    showMessage(
      "Partida encontrada: " +
      (character.career || "personaje creado")
    );

    openCreator();

  }else{

    showMessage("Todavía no tienes una partida guardada.");

  }

}


/* =========================================================
   MODALES
========================================================= */

function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("open");

}

function openCustomization(category){

  const modal =
    document.getElementById("customModal");

  const title =
    document.getElementById("customTitle");

  const content =
    document.getElementById("customContent");

  title.textContent = category;

  content.innerHTML = "";

  const groups =
    customization[category];

  Object.entries(groups).forEach(
    ([group,items])=>{

      const heading =
        document.createElement("div");

      heading.className="section-title";
      heading.textContent=group;

      content.appendChild(heading);

      const grid =
        document.createElement("div");

      grid.className="option-grid";

      items.forEach(item=>{

        const button =
          document.createElement("button");

        button.className="option";
        button.textContent=item;

        button.onclick=()=>{

          if(category==="APARIENCIA"){

            if(group==="TIPO DE CARA")
              character.appearance=item;

            if(group==="COLOR DE PIEL")
              character.skin=item;

            if(group==="OJOS")
              character.eyes=item;

            if(group==="CEJAS")
              character.brows=item;

            if(group==="EXPRESIÓN")
              character.expression=item;

          }

          if(category==="PEINADO")
            character.hair=item;

          if(category==="ROPA"){

            if(group==="ESTILOS")
              character.clothes=item;

            if(group==="PRENDAS")
              character.clothes=item;

          }

          if(category==="PENDIENTES")
            character.earrings=item;

          if(category==="EXTRAS")
            character.extras=item;

          showMessage("Seleccionado: "+item);

        };

        grid.appendChild(button);

      });

      content.appendChild(grid);

    }
  );

  modal.classList.add("open");
}


/* =========================================================
   CARRERAS
========================================================= */

function openCareer(){

  document
    .getElementById("careerModal")
    .classList.add("open");

  renderCareers(careers);

}

function renderCareers(list){

  const container =
    document.getElementById("careerList");

  container.innerHTML="";

  list.forEach(([name,campus])=>{

    const button =
      document.createElement("button");

    button.className="career-card";

    button.innerHTML=
      "<strong>"+name+"</strong>"+
      "<small>Campus: "+campus+"</small>";

    button.onclick=()=>{

      character.career=name;
      character.campus=campus;

      closeModal("careerModal");

      showMessage(
        "Carrera seleccionada: "+name
      );

    };

    container.appendChild(button);

  });

}

function filterCareers(){

  const search =
    document
      .getElementById("careerSearch")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    careers.filter(([name,campus])=>
      (name+" "+campus)
        .toLowerCase()
        .includes(search)
    );

  renderCareers(filtered);

}

/* =========================================================
   ALEATORIO
========================================================= */

function randomItem(array){
  return array[
    Math.floor(
      Math.random()*array.length
    )
  ];
}

function randomCharacter(){

  character.appearance=
    randomItem(customization.APARIENCIA["TIPO DE CARA"]);

  character.skin=
    randomItem(customization.APARIENCIA["COLOR DE PIEL"]);

  character.eyes=
    randomItem(customization.APARIENCIA["OJOS"]);

  character.brows=
    randomItem(customization.APARIENCIA["CEJAS"]);

  character.expression=
    randomItem(customization.APARIENCIA["EXPRESIÓN"]);

  character.hair=
    randomItem(customization.PEINADO["CORTES"]);

  character.clothes=
    randomItem(customization.ROPA["PRENDAS"]);

  character.earrings=
    randomItem(customization.PENDIENTES["PENDIENTES"]);

  character.extras=
    randomItem(customization.EXTRAS["ACCESORIOS"]);

  showMessage("🎲 Personaje aleatorio creado");

}


/* =========================================================
   CREAR PERSONAJE
========================================================= */

function createCharacter(){

  if(!character.career){

    showMessage(
      "Primero elige una carrera."
    );

    openCareer();

    return;
  }

  if(!character.course){

    showMessage(
      "Primero elige tu curso."
    );

    openCourse();

    return;
  }

  if(!character.personality){

    showMessage(
      "Elige una personalidad."
    );

    openPersonality();

    return;
  }

  localStorage.setItem(
    "gamucaCharacter",
    JSON.stringify(character)
  );

  showMessage(
    "✓ Personaje creado y guardado"
  );

  console.log(
    "PERSONAJE GAMUCA",
    character
  );

}


/* =========================================================
   MENSAJES
========================================================= */

let toastTimer;

function showMessage(message){

  const toast =
    document.getElementById("toast");

  toast.textContent=message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{

    toast.classList.remove("show");

  },2200);

}

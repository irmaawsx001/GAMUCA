<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GAMUCA</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html, body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100vh;
  background:#08070c;
  color:#f4d9c8;
  font-family:"Courier New", monospace;
  overflow-x:hidden;
}

button, input{ font:inherit; }
button{ cursor:pointer; }

.game{
  width:100%;
  min-height:100vh;
  background:#08070c;
  display:flex;
  justify-content:center;
  align-items:center;
}

.screen{
  display:none;
  position:relative;
  width:min(100vw, 56.25vh);
  height:min(177.7777778vw, 100vh);
  aspect-ratio:9/16;
  overflow:hidden;
  margin: auto;
}

.screen.active{ display:block; }

/* =========================================================
   PORTADA (IMAGEN DEL REPO)
========================================================= */

#home{
  background: #08080c url("./file_00000000b9d881f4b24a2fea9f042d49.png") center center / cover no-repeat;
}

.home-hit{
  position:absolute;
  background:transparent;
  border:0;
  z-index:10;
}

/* Hitboxes calculadas exactamente sobre la ilustración de la portada */
.home-play      { left:26.5%; width:47%; top:62.8%; height:5.8%; }
.home-create    { left:27.5%; width:45%; top:69.5%; height:5.2%; }
.home-continue  { left:27.5%; width:45%; top:75.2%; height:5.2%; }
.home-options   { left:32.0%; width:36%; top:81.0%; height:5.0%; }

.home-about     { left:16%; width:16%; bottom:2.5%; height:5%; }
.home-ranking   { left:34%; width:16%; bottom:2.5%; height:5%; }
.home-achievements { left:52%; width:16%; bottom:2.5%; height:5%; }
.home-shop      { left:70%; width:16%; bottom:2.5%; height:5%; }

/* =========================================================
   CREADOR DE PERSONAJE (IMAGEN DEL REPO)
========================================================= */

#creator{
  background: #09070d url("./file_000000008f9081f48664970b19944855.png") center top / cover no-repeat;
}

.close-stage-hit {
  position: absolute;
  top: 1.5%;
  right: 3%;
  width: 10%;
  height: 5.5%;
  background: transparent;
  border: 0;
  z-index: 40;
}

.character-base-img {
  position: absolute;
  top: 11.2%;
  left: 17.5%;
  width: 20%;
  height: auto;
  z-index: 12;
  pointer-events: none;
  user-select: none;
  filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
}

.creator-tab {
  position: absolute;
  top: 51.0%;
  height: 4.2%;
  background: transparent;
  border: 0;
  z-index: 30;
}

.tab-apariencia { left: 6%;   width: 18.5%; }
.tab-peinado    { left: 24.5%; width: 17%; }
.tab-ropa       { left: 41.5%; width: 18.5%; }
.tab-pendientes { left: 60%;   width: 18%; }
.tab-extras     { left: 78%;   width: 16%; }

.options-overlay-panel {
  position: absolute;
  top: 56.5%;
  left: 6%;
  width: 88%;
  height: 29.5%;
  z-index: 35;
  overflow-y: auto;
  padding: 6px 4px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.options-overlay-panel::-webkit-scrollbar { width: 4px; }
.options-overlay-panel::-webkit-scrollbar-thumb { background: #49374d; }

.pixel-section-title {
  color: #d9a86c;
  font-size: 9px;
  text-transform: uppercase;
  margin-top: 2px;
  letter-spacing: 1px;
}

.pixel-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
}

.pixel-opt-btn {
  background: rgba(18, 13, 21, 0.75);
  border: 1px solid #3b2a40;
  border-radius: 3px;
  color: #f0d8e9;
  padding: 5px 2px;
  font-size: 9px;
  text-align: center;
  transition: all 0.15s ease;
}

.pixel-opt-btn:hover, .pixel-opt-btn.selected {
  border-color: #f3c9dc;
  background: rgba(189, 104, 255, 0.3);
  box-shadow: 0 0 6px rgba(189, 104, 255, 0.5);
}

.create-btn-hit {
  position: absolute;
  top: 87.5%;
  left: 18.5%;
  width: 63%;
  height: 5.2%;
  background: transparent;
  border: 0;
  z-index: 40;
}

/* MODALES */
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(4,3,8,.88);
  padding:5vh 4vw;
  overflow:auto;
}

.modal.open{
  display:flex;
  justify-content:center;
  align-items:center;
}

.modal-box{
  width:min(94vw,500px);
  max-height:85vh;
  overflow:auto;
  background: linear-gradient(180deg,#17101d,#0c0910);
  border:2px solid #9b4cff;
  box-shadow:0 0 20px rgba(175,77,255,.35);
  padding:16px;
}

.modal-title{ font-size:16px; color:#e8aaff; text-align:center; margin-bottom:12px; }
.close-modal-btn{ float:right; background:#241427; border:1px solid #d48cff; color:#f1c9ff; padding:4px 8px; }
.career-search{ width:100%; padding:10px; background:#0a080d; color:white; border:1px solid #6e4a78; outline:none; margin-bottom:10px; }
.career-list{ display:flex; flex-direction:column; gap:6px; max-height:40vh; overflow:auto; }
.career-card{ text-align:left; padding:8px; background:#100c13; border:1px solid #3b2a40; color:#eee; font-size:12px; }
.career-card strong{ display:block; color:#f3c9dc; }
.career-card small{ color:#a995a9; }
.career-card:hover, .career-card.selected{ border-color:#bd68ff; background:#21132b; }

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(30px);
  background:#180e20;
  border:1px solid #bd68ff;
  color:#fff;
  padding:10px 16px;
  font-size:12px;
  z-index:300;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

<body>

<div class="game">

<!-- PORTADA -->
<section id="home" class="screen active">
  <button class="home-hit home-play" onclick="openCreator()" aria-label="Jugar"></button>
  <button class="home-hit home-create" onclick="openCreator()" aria-label="Crear personaje"></button>
  <button class="home-hit home-continue" onclick="continueGame()" aria-label="Continuar partida"></button>
  <button class="home-hit home-options" onclick="showMessage('Opciones próximamente')" aria-label="Opciones"></button>

  <button class="home-hit home-about" onclick="showMessage('GAMUCA · Tu carrera. Tu personaje. Tu partida.')" aria-label="Sobre"></button>
  <button class="home-hit home-ranking" onclick="showMessage('Ranking próximamente')" aria-label="Ranking"></button>
  <button class="home-hit home-achievements" onclick="showMessage('Logros próximamente')" aria-label="Logros"></button>
  <button class="home-hit home-shop" onclick="showMessage('Tienda próximamente')" aria-label="Tienda"></button>
</section>

<!-- CREADOR DE PERSONAJE -->
<section id="creator" class="screen">
  <button class="close-stage-hit" onclick="goHome()" aria-label="Cerrar"></button>

  <!-- IMAGEN BASE DEL PERSONAJE DEL REPO -->
  <img src="./file_00000000dbac82109b35918672afabd5.png" alt="Personaje Base" class="character-base-img">

  <button class="creator-tab tab-apariencia" onclick="switchCategory('APARIENCIA')"></button>
  <button class="creator-tab tab-peinado"    onclick="switchCategory('PEINADO')"></button>
  <button class="creator-tab tab-ropa"       onclick="switchCategory('ROPA')"></button>
  <button class="creator-tab tab-pendientes" onclick="switchCategory('PENDIENTES')"></button>
  <button class="creator-tab tab-extras"     onclick="switchCategory('EXTRAS')"></button>

  <div class="options-overlay-panel" id="optionsPanel"></div>

  <button class="create-btn-hit" onclick="createCharacter()" aria-label="Crear Personaje"></button>
</section>

</div>

<!-- MODAL DE CARRERA -->
<div id="careerModal" class="modal">
  <div class="modal-box">
    <button class="close-modal-btn" onclick="closeModal('careerModal')">✕</button>
    <div class="modal-title">🎓 ELIGE TU CARRERA</div>
    <input id="careerSearch" class="career-search" placeholder="Buscar carrera..." oninput="filterCareers()">
    <div id="careerList" class="career-list"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

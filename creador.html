<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GAMUCA — Crear personaje</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#08070c;
  color:#f4d9c8;
  font-family:"Courier New",monospace;
}

button{
  font:inherit;
  cursor:pointer;
}


/* ================================
   PANTALLA DEL CREADOR
================================ */

.creator{

  width:min(100vw,56.25vh);

  height:min(177.7777778vw,100vh);

  aspect-ratio:9/16;

  margin:auto;

  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      rgba(8,7,12,.30),
      rgba(8,7,12,.72)
    ),
    url("file_00000000b9d881f4b24a2fea9f042d49.png")
    center/cover
    no-repeat;
}


/* ================================
   CABECERA
================================ */

.header{

  position:absolute;

  left:6%;
  right:6%;
  top:3%;

  display:flex;

  justify-content:center;

  z-index:3;
}


.logo{

  margin:0;

  color:#f4d9c8;

  font-size:clamp(24px,7vw,42px);

  letter-spacing:2px;

  text-shadow:
    3px 3px #21141d;
}


.close{

  position:absolute;

  right:0;

  top:-2px;

  width:38px;
  height:38px;

  border:2px solid #8d6b59;

  background:#151017;

  color:#f4d9c8;

  font-size:24px;

  box-shadow:
    3px 3px #21141d;
}


/* ================================
   TÍTULO
================================ */

.title{

  position:absolute;

  top:11%;

  left:8%;
  right:8%;

  text-align:center;

  font-size:clamp(13px,4vw,21px);

  font-weight:bold;

  letter-spacing:1px;

  text-shadow:
    2px 2px #21141d;

  z-index:3;
}


/* ================================
   ZONA DEL PERSONAJE
================================ */

.preview{

  position:absolute;

  left:7%;
  right:7%;

  top:17%;

  height:35%;

  border:2px solid #6f5048;

  background:
    rgba(8,7,12,.55);

  box-shadow:
    4px 4px rgba(20,12,20,.8);

  display:flex;

  align-items:center;

  justify-content:center;
}


.preview-label{

  position:absolute;

  top:8px;
  left:12px;

  font-size:11px;

  color:#caa894;

  letter-spacing:1px;
}


.avatar-placeholder{

  width:34%;

  height:80%;

  border:2px dashed #76574c;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#b99580;

  text-align:center;

  font-size:10px;
}


/* ================================
   PESTAÑAS
================================ */

.tabs{

  position:absolute;

  left:5%;
  right:5%;

  top:54%;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:3px;

  z-index:4;
}


.tab{

  min-height:44px;

  border:2px solid #5f4741;

  background:#141017;

  color:#d8b8a5;

  font-size:9px;

  padding:5px 2px;
}


.tab.active{

  background:#ead0ae;

  color:#21151a;

  border-color:#f4d9c8;

  box-shadow:
    2px 2px #21141d;
}


/* ================================
   OPCIONES
================================ */

.options{

  position:absolute;

  left:5%;
  right:5%;

  top:62%;

  bottom:5%;

  border:2px solid #5f4741;

  background:
    rgba(8,7,12,.88);

  padding:12px;
}


.section-title{

  margin:0 0 9px;

  color:#e4c5ae;

  font-size:11px;

  letter-spacing:1px;
}


.option-grid{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:8px;
}


.option{

  aspect-ratio:1;

  border:2px solid #49383a;

  background:#171219;

  color:#c9a99a;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:8px;

  text-align:center;
}


.option.selected{

  border-color:#ead0ae;

  box-shadow:
    inset 0 0 0 2px #8f6c58;
}

</style>
</head>


<body>


<main class="creator">


  <!-- CABECERA -->

  <header class="header">

    <h1 class="logo">
      GAMUCA
    </h1>

    <button
      class="close"
      aria-label="Cerrar">
      ×
    </button>

  </header>


  <!-- TÍTULO -->

  <div class="title">
    CREA TU PERSONAJE
  </div>


  <!-- PERSONAJE -->

  <section
    class="preview"
    aria-label="Vista previa del personaje">

    <span class="preview-label">
      TU PERSONAJE
    </span>

    <div class="avatar-placeholder">

      AQUÍ IRÁ
      <br>
      EL PERSONAJE BASE

    </div>

  </section>


  <!-- CATEGORÍAS -->

  <nav
    class="tabs"
    aria-label="Categorías">

    <button class="tab active">
      APARIENCIA
    </button>

    <button class="tab">
      PEINADO
    </button>

    <button class="tab">
      ROPA
    </button>

    <button class="tab">
      PENDIENTES
    </button>

    <button class="tab">
      EXTRAS
    </button>

  </nav>


  <!-- OPCIONES -->

  <section class="options">

    <h2 class="section-title">
      APARIENCIA
    </h2>

    <div class="option-grid">

      <button class="option selected">
        CARA
      </button>

      <button class="option">
        PIEL
      </button>

      <button class="option">
        OJOS
      </button>

      <button class="option">
        EXPRESIÓN
      </button>

    </div>

  </section>


</main>


</body>
</html>
